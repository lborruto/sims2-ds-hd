# Runs only once the repository is public (owner rule: no Actions on private repos).
name: CodeQL

# GitHub's code scanning on the C/C++ sources (src/): on pull requests, on pushes to main (the
# baseline pull requests are compared with) and once a week, so a new query finds old code too.
# The results go to the repository's Security tab. Source-only analysis (build-mode: none): no
# build, nothing downloaded runs in this job. Code scanning needs a public repository on the free
# plan: while the repository is private, the job is skipped.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 05:23 UTC.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-01); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  analyze:
    name: Analyze (C/C++)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      # The submodule (melonDS) is not checked out: only this repository's code is scanned.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0 (2026-10-15)
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0 (2026-10-15)
        with:
          category: /language:c-cpp
