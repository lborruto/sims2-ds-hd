name: CI

# Every pull request and every push to main: a Release build on Linux and macOS (with the
# program's version check), a secret scan of the whole history and actionlint on the workflows.
# No ROM is available to CI, so the game itself is never run here: changes to what the program
# shows are checked by hand with your own ROM (CONTRIBUTING.md). Tags are not pushes here:
# release.yml calls this workflow on the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push supersedes the running checks of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-01); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  # Docs-only pull requests skip the build: it reports "skipped", and the "CI result" job below
  # (the one check to require) passes. A push always builds. Only the runner's own variables are
  # read: no event payload.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD || true)"
          fi
          if [ -z "$base" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Markdown, docs/ (screenshots), LICENSE and issue templates cannot break the build.
          code="$(git diff --name-only "$base" HEAD | grep -vE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || true)"
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >>"$GITHUB_OUTPUT"

  lint:
    name: Workflows (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # rhysd/actionlint release v1.7.12 (2026-03-30), linux_amd64 archive. The checksum is the
      # one in the release's checksums.txt; the download is verified against it before use.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          rm "$archive"
      # actionlint runs shellcheck (preinstalled on the runner) on every run: script.
      - run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color

  secrets:
    name: Secrets (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # gitleaks release v8.30.1 (2026-03-21), linux_x64 archive. The checksum is the one in the
      # release's checksums.txt; the download is verified against it before use.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          # The whole history, every branch: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive"
      # The default rules (.gitleaks.toml allow-lists nothing). Findings are printed redacted.
      - run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 --config .gitleaks.toml .

  # The platforms the release ships: Linux x86_64 and macOS on Apple silicon. Windows is not
  # built yet (the melonDS core is not tested with MSVC here).
  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          submodules: true
      - name: Build tools and SDL's system headers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            # SDL2 is built from source (CMakeLists.txt); these are the window, input and sound
            # systems it compiles in.
            sudo apt-get install -y -q ninja-build libx11-dev libxext-dev libxrandr-dev \
              libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
              wayland-protocols libasound2-dev libpulse-dev
          else
            brew install ninja
          fi
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: ninja -C build sims2wide
      # The version the program reports is the one in CMakeLists.txt.
      - name: Version check
        run: |
          want="$(sed -n 's/^project(sims2wide VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          got="$(build/sims2wide --version)"
          echo "$got"
          test "$got" = "sims2wide $want"

  # The one check to require: green when every job passed or was skipped as docs-only.
  result:
    name: CI result
    if: always()
    needs: [changes, lint, secrets, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jobs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
