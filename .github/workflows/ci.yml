name: CI

# Every pull request and every push to main: a Release build on Linux and macOS (with the
# program's version check), a secret scan of the whole history and actionlint on the workflows.
# No ROM is available to CI, so the game itself is never run here: changes to what the program
# shows are checked by hand with your own ROM (CONTRIBUTING.md). Tags are not pushes here:
# release.yml calls this workflow on the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push supersedes the running checks of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-01); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  # Docs-only pull requests skip the build: it reports "skipped", and the "CI result" job below
  # (the one check to require) passes. A push always builds. Only the runner's own variables are
  # read: no event payload.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD || true)"
          fi
          if [ -z "$base" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Markdown, docs/ (screenshots), LICENSE and issue templates cannot break the build.
          code="$(git diff --name-only "$base" HEAD | grep -vE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || true)"
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >>"$GITHUB_OUTPUT"

  lint:
    name: Workflows (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # rhysd/actionlint release v1.7.12 (2026-03-30), linux_amd64 archive. The checksum is the
      # one in the release's checksums.txt; the download is verified against it before use.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          rm "$archive"
      # actionlint runs shellcheck (preinstalled on the runner) on every run: script.
      - run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color

  secrets:
    name: Secrets (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # gitleaks release v8.30.1 (2026-03-21), linux_x64 archive. The checksum is the one in the
      # release's checksums.txt; the download is verified against it before use.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          # The whole history, every branch: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive"
      # The default rules (.gitleaks.toml allow-lists nothing). Findings are printed redacted.
      - run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 --config .gitleaks.toml .

  # The platforms the release ships: Linux x86_64, macOS (the app, Apple silicon and Intel in one)
  # and Windows x86_64 (below), built the way release.yml builds them.
  build:
    name: Build (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          # Intel: GitHub's Apple silicon runners are often out of capacity (jobs cancelled
          # unstarted, November 2026). The app is universal either way.
          - os: macos-15-intel
            platform: macos-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          submodules: true
      - name: Build tools and SDL's system headers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            # SDL2 is built from source (CMakeLists.txt); these are the window, input and sound
            # systems it compiles in.
            sudo apt-get install -y -q ninja-build libx11-dev libxext-dev libxrandr-dev \
              libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
              wayland-protocols libasound2-dev libpulse-dev
          else
            brew install ninja
          fi
      - name: Configure
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSIMS2WIDE_MAC_APP=ON \
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
      - run: ninja -C build sims2wide
      # The unit tests (plain executables; no ROM needed). On a Mac the app is universal but these
      # are built for the host (Intel here), so they run as they are. controls_test opens SDL.
      - name: Unit tests
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          tests="layout_test touchscript_test hotspots_test screens_test navigator_test controls_test"
          # shellcheck disable=SC2086
          ninja -C build $tests
          for t in $tests; do
            echo "== $t"
            "build/$t"
          done
      # The version the program reports is the one in CMakeLists.txt. On a Mac the app holds both
      # halves; the Intel runner can only run its own (the Apple silicon one is checked present).
      - name: Version check
        run: |
          want="sims2wide $(sed -n 's/^project(sims2wide VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "$RUNNER_OS" = macOS ]; then
            bin="build/Sims 2 DS Wide.app/Contents/MacOS/Sims 2 DS Wide"
            lipo "$bin" -verify_arch arm64 x86_64
            got="$(arch -x86_64 "$bin" --version)"
            echo "x86_64: $got"
            test "$got" = "$want"
          else
            got="$(build/sims2wide --version)"
            echo "$got"
            test "$got" = "$want"
          fi

  # Windows: MinGW (UCRT) from MSYS2, the toolchain melonDS itself builds with on Windows. The
  # program is linked statically: one .exe, no DLL beside it.
  build-windows:
    name: Build (windows-x86_64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          submodules: true
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 (2026-09-27)
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: ninja -C build sims2wide
      - name: Version check, and no DLL needed beyond Windows' own
        run: |
          want="sims2wide $(sed -n 's/^project(sims2wide VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          got="$(build/sims2wide.exe --version)"
          echo "$got"
          test "$got" = "$want"
          # Every DLL the program imports must be part of Windows itself.
          objdump -p build/sims2wide.exe | sed -n 's/^\s*DLL Name: //p' | tee dlls.txt
          if grep -viE '^(kernel32|user32|gdi32|winmm|imm32|ole32|oleaut32|version|advapi32|setupapi|shell32|comdlg32|ws2_32|iphlpapi|dinput8|dxguid|cfgmgr32|hid|msvcrt|ucrtbase|api-ms-win-[a-z0-9-]+)\.dll$' dlls.txt; then
            echo "::error::the program needs a DLL that is not part of Windows"
            exit 1
          fi

  # The one check to require: green when every job passed or was skipped as docs-only.
  result:
    name: CI result
    if: always()
    needs: [changes, lint, secrets, build, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jobs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
