# Runs only once the repository is public (owner rule: no Actions on private repos).
name: Release

# A tag vX.Y.Z on main runs CI on the tagged commit, builds the program for Linux x86_64, macOS
# (Sims 2 DS Wide.app, Apple silicon and Intel in one) and Windows x86_64, attests the archives'
# build provenance, then creates the GitHub release with that version's section of CHANGELOG.md as
# notes and the three archives attached. The version in CMakeLists.txt must be the tag's. The
# archives hold the program, README.md, LICENSE, the embedded font's licence (OFL-Nunito.txt) and
# the embedded controller mappings' (LICENSE-SDL_GameControllerDB.txt, zlib); xBRZ (src/thirdparty/xbrz,
# the game pictures' scaler) is GPLv3 like the program: LICENSE covers it, no file of its own:
# never a ROM, a save or anything from the game.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Tags queue rather than cancel one another: a cancelled run could leave an attestation without
# its release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-01); the comment names the release and the date it was published. No Actions
# cache feeds the build: the released programs are built from a clean checkout.
jobs:
  # A release is only ever made from reviewed code: the tagged commit must be on main.
  on-main:
    name: Tagged commit is on main
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Asked of GitHub's API rather than with git fetch: the checkout keeps no credentials, and
      # a private repository cannot be fetched without them.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # main's commit by its full branch name, so a tag called "main" cannot stand in for it.
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" -q .object.sha)"
          status="$(gh api "repos/$GH_REPO/compare/$main_sha...$GITHUB_SHA" -q .status)"
          echo "compared with main ($main_sha): $status"
          case "$status" in identical | behind) ;; *)
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main ($status)"
            exit 1 ;;
          esac

  checks:
    name: CI on the tagged commit
    needs: on-main
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The version and the notes, checked before anything is built.
  notes:
    name: Version and notes
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: CMakeLists.txt version is the tag's
        run: |
          version="$(sed -n 's/^project(sims2wide VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::CMakeLists.txt says $version but the tag is $TAG; bump the version before tagging"
            exit 1
          fi
      # The notes are the `## [X.Y.Z]` section of CHANGELOG.md (Keep a Changelog); a tag without
      # its section fails here.
      - name: Notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md >"$RUNNER_TEMP/notes/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; add it before tagging v$version"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 5

  build:
    name: Build (${{ matrix.platform }})
    needs: notes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          # Intel: see ci.yml (Apple silicon runner capacity).
          - os: macos-15-intel
            platform: macos-universal
    env:
      TAG: ${{ github.ref_name }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          submodules: true
      - name: Build tools and SDL's system headers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q ninja-build libx11-dev libxext-dev libxrandr-dev \
              libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
              wayland-protocols libasound2-dev libpulse-dev libudev-dev
          else
            brew install ninja
          fi
      - name: Configure
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSIMS2WIDE_MAC_APP=ON \
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
      - run: ninja -C build sims2wide
      - name: Pack
        run: |
          version="${TAG#v}"
          name="sims2-ds-wide-${version}-${PLATFORM}"
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out/$name"
          cp README.md LICENSE "$out/$name/"
          cp assets/fonts/OFL.txt "$out/$name/OFL-Nunito.txt"
          cp assets/controllers/LICENSE.txt "$out/$name/LICENSE-SDL_GameControllerDB.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            cp build/sims2wide "$out/$name/"
            cd "$out"
            tar -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" | tee "$name.sha256"
          else
            # Not notarised (that needs a paid Apple developer account): an ad-hoc signature,
            # which Apple silicon needs to run it at all. First start: right click > Open.
            cp -R "build/Sims 2 DS Wide.app" "$out/$name/"
            codesign --force --deep -s - "$out/$name/Sims 2 DS Wide.app"
            codesign -v "$out/$name/Sims 2 DS Wide.app"
            cd "$out"
            ditto -c -k --keepParent "$name" "$name.zip"
            shasum -a 256 "$name.zip" | tee "$name.sha256"
          fi
          rm -r "${out:?}/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: dist-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 5

  build-windows:
    name: Build (windows-x86_64)
    needs: notes
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          submodules: true
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 (2026-09-27)
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: ninja -C build sims2wide
      - name: Pack
        run: |
          version="${TAG#v}"
          name="sims2-ds-wide-${version}-windows-x86_64"
          out="$(cygpath -u "$RUNNER_TEMP")/dist"
          mkdir -p "$out/$name"
          cp build/sims2wide.exe README.md LICENSE "$out/$name/"
          cp assets/fonts/OFL.txt "$out/$name/OFL-Nunito.txt"
          cp assets/controllers/LICENSE.txt "$out/$name/LICENSE-SDL_GameControllerDB.txt"
          cd "$out"
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" | tee "$name.sha256"
          rm -r "${out:?}/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: dist-windows-x86_64
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 5

  # A signed build-provenance attestation of the archives (Sigstore, stored by GitHub): who built
  # them, from which commit and workflow. The OIDC token exists only in this job, which runs no
  # code from the repository.
  # Attestations need a public repository on GitHub's free plan: while the repository is
  # private the job is skipped, and the release says so.
  attest:
    name: Build provenance
    needs: [build, build-windows]
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (2026-10-07)
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (2026-08-06)
        with:
          subject-path: |
            dist/sims2-ds-wide-*.tar.gz
            dist/sims2-ds-wide-*.zip

  release:
    name: GitHub release
    needs: [notes, build, build-windows, attest]
    # Runs when every build passed and the attestation passed, or was skipped (private).
    if: ${{ always() && needs.notes.result == 'success' && needs.build.result == 'success' && needs.build-windows.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (2026-10-07)
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (2026-10-07)
        with:
          name: notes
          path: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ATTESTED: ${{ needs.attest.result }}
        run: |
          {
            echo
            echo "---"
            echo
            echo "Attached (SHA-256):"
            echo
            for f in dist/*.sha256; do echo "- \`$(cut -d' ' -f3 "$f")\` \`$(cut -d' ' -f1 "$f")\`"; done
            echo
            if [ "$ATTESTED" = success ]; then
              echo "Check an archive's build provenance with"
              echo "\`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`."
            fi
            echo "The programs are not signed by Apple or Microsoft: the first time, right click >"
            echo "Open on a Mac, and More info > Run anyway on Windows."
          } >>notes/notes.md
          set --
          case "$TAG" in *-*) set -- --prerelease ;; esac
          gh release create "$TAG" dist/sims2-ds-wide-*.tar.gz dist/sims2-ds-wide-*.zip \
            --verify-tag --title "$TAG" --notes-file notes/notes.md "$@"
